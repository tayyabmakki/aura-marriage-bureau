.hero img{width:min(380px,78vw);height:auto;filter:drop-shadow(0 4px 24px rgba(0,0,0,.6))}
.hero h1{font-weight:300;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold2);margin:22px 0 8px}
.hero p{margin:0 auto;max-width:520px;color:#cfc4a8;font-size:13.5px;font-weight:300}
.hero p.ur{display:block;margin-top:8px;color:#b9ad90;font-size:13.5px}
.orn{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:16px;color:var(--gold)}
.orn i{height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold))}.orn i+svg+i{background:linear-gradient(270deg,transparent,var(--gold))}
main{max-width:700px;margin:-44px auto 0;padding:0 16px 40px;position:relative}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:var(--mut);padding:8px 12px;font:500 11px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-bottom:1px solid transparent}
.tab.on{color:var(--gold2);border-bottom-color:var(--gold)}
.tab.done{color:var(--gold)}
.bar{height:2px;background:rgba(255,255,255,.07);border-radius:2px;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--gg);border-radius:2px;transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.06em;color:var(--mut);margin-bottom:12px}.meta b{color:var(--gold2);font-weight:500}
.note{border-left:2px solid var(--gold);background:rgba(212,175,97,.07);border-radius:4px 10px 10px 4px;padding:11px 14px;font-size:12.5px;color:#cfc4a8;margin-bottom:14px;font-weight:300}.note b{color:var(--gold2);font-weight:500}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h2{font-weight:300;font-size:19px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 4px;color:var(--gold2)}
.ur{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Segoe UI",serif;direction:rtl;color:var(--mut);font-size:14px;font-weight:400;letter-spacing:0;text-transform:none}
h2+.ur{display:block;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.f{margin-bottom:20px}
.f>label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;font-weight:500;color:#e6dcc3}
.f>label .ur{font-size:13px}
.r{color:var(--gold);margin-left:3px}
.hint{font-size:11.5px;color:var(--mut);margin-top:6px;font-weight:300}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],select,textarea{width:100%;background:rgba(8,7,6,.7);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:13px 14px;font:400 15px Montserrat,sans-serif;color-scheme:dark;transition:border-color .2s,box-shadow .2s}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,97,.15)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input{position:absolute;opacity:0}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:9px 18px;cursor:pointer;font-size:13.5px;transition:all .2s;background:rgba(8,7,6,.5)}
.chip span:hover{border-color:var(--gold)}
.chip input:checked+span{background:var(--gg);color:#1c1406;border-color:transparent;font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--gold2);outline-offset:2px}
.bad input,.bad select,.bad textarea,.bad .chip span{border-color:var(--err)}
.bad .msg{display:block}
.msg{display:none;color:var(--err);font-size:12px;margin-top:6px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
button.b,a.b{border:0;border-radius:30px;padding:13px 26px;font:600 12.5px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;background:var(--gg);color:#1c1406;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 20px rgba(201,162,75,.22)}
button.b:hover,a.b:hover{transform:translateY(-1px)}
button.b.g{background:transparent;color:var(--mut);border:1px solid var(--line);box-shadow:none}
a.b{display:inline-block;text-decoration:none;text-align:center}
a.b.w{background:#25d366;color:#052e14;box-shadow:none}
pre{white-space:pre-wrap;word-break:break-word;background:rgba(8,7,6,.7);border:1px solid var(--line);border-radius:12px;padding:16px;font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;max-height:420px;overflow:auto;color:#eadfc4}
.miss{color:var(--err);font-size:13px;margin:0 0 14px}
.miss a{color:var(--gold2);cursor:pointer;text-decoration:underline}
footer{text-align:center;color:var(--mut);font-size:11.5px;letter-spacing:.05em;padding:10px 16px 34px;border-top:1px solid var(--line);max-width:700px;margin:0 auto;line-height:2}
footer a{color:var(--gold2);text-decoration:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gg);color:#1c1406;padding:11px 22px;border-radius:30px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media(max-width:480px){.card{padding:22px 16px}.f>label{flex-direction:column;gap:2px}}

.hero{padding-bottom:84px}
.hero .tag{font:italic 400 clamp(15px,4.2vw,19px) Lora,Georgia,serif;color:#e9dcc0;margin:14px 0 0;letter-spacing:.01em}
.flags{display:flex;gap:12px;justify-content:center;margin:18px 0 4px}.flags img{width:38px;height:38px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.hero h2.big{font:italic 500 clamp(26px,7vw,36px)/1.15 Lora,Georgia,serif;letter-spacing:0;text-transform:none;color:#f4ecda;margin:22px 0 10px}
.hero h2.big em{display:block;font-style:italic;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1{margin:6px 0 8px}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:56px;display:block}
main{margin-top:-24px}
.trust{display:flex;justify-content:center;align-items:center;gap:0;margin:26px 0 22px;flex-wrap:wrap}
.trust div{display:flex;align-items:center;gap:8px;padding:2px 16px;font:500 11px Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#e6dcc3}
.trust div+div{border-left:1px solid var(--line)}
.trust svg{color:var(--gold);flex:none}
.ct{display:grid;gap:12px;max-width:420px;margin:0 auto 24px;text-align:left}
.ct a,.ct span.i{display:flex;align-items:center;gap:14px;color:var(--txt);text-decoration:none;font-size:14.5px;letter-spacing:.02em}
.ct b{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);background:rgba(212,175,97,.05)}
.ct small{display:block;font-size:10px;letter-spacing:.26em;color:var(--mut);text-transform:uppercase;margin-top:1px}
.ct .ph{font-size:19px;font-weight:500;letter-spacing:.04em}
.sv{display:flex;align-items:center;gap:14px;margin-top:6px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold2)}
.sv i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}.sv i:last-child{background:linear-gradient(270deg,transparent,var(--line))}
.fm{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--gold);margin:6px 0 4px}.fm i{height:1px;width:80px;background:linear-gradient(90deg,transparent,var(--gold))}.fm i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
footer{border-top:0;padding-top:0}
@media(max-width:480px){.sv{font-size:9px;letter-spacing:.14em;text-align:center}.sv i{display:none}.trust div{padding:4px 10px;font-size:10px;letter-spacing:.14em}.flags img{width:34px;height:34px}}
</style>
</head>

const KEY = "profile-form-v1";
let S = {}, cur = 0, bad = new Set();
try { const d = JSON.parse(localStorage.getItem(KEY) || "{}"); S = d.S || {}; cur = d.cur || 0; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({S, cur})); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function field(f) {
  const [k, en, ur, type, opts, req, hint] = f, v = S[k] || "";
  let inp;
  if (type === "radio") inp = '<div class="chips">' + opts.map(o => `<label class="chip"><input type="radio" name="${k}" value="${esc(o)}" ${v === o ? "checked" : ""}><span>${esc(o)}</span></label>`).join("") + "</div>";
  else if (type === "select") inp = `<select name="${k}"><option value="">Choose…</option>${opts.map(o => `<option ${v === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (type === "textarea") inp = `<textarea name="${k}">${esc(v)}</textarea>`;
  else inp = `<input type="${type === "number" ? "number" : type}" ${type === "number" ? 'min="16" max="90" inputmode="numeric"' : ""} name="${k}" value="${esc(v)}" ${type === "text" ? 'autocomplete="off"' : ""}>`;
  return `<div class="f ${bad.has(k) ? "bad" : ""}" data-k="${k}"><label><span>${en}${req ? '<b class="r">*</b>' : ""}</span><span class="ur">${ur}</span></label>${inp}${hint ? `<div class="hint">${esc(hint)}</div>` : ""}<div class="msg">This field is required.</div></div>`;
}

function build() {
  const out = [`*${CONFIG.brand} · Profile Form*`];
  STEPS.slice(0, 7).forEach(s => {
    const lines = s.f.filter(f => S[f[0]]).map(f => `${f[1]}: ${S[f[0]]}`);
    if (lines.length) out.push("", `*${s.t.toUpperCase()}*`, ...lines);
  });
  return out.join("\n");
}
const missing = () => STEPS.flatMap((s, i) => s.f.filter(f => f[5] && !String(S[f[0]] || "").trim()).map(f => ({i, k: f[0], n: f[1]})));

function render() {
  const s = STEPS[cur];
  $("tabs").innerHTML = STEPS.map((x, i) => `<button class="tab ${i === cur ? "on" : i < cur ? "done" : ""}" data-go="${i}">${i + 1}. ${x.t}</button>`).join("");
  $("prog").style.width = ((cur + 1) / STEPS.length * 100) + "%";
  $("stepLbl").innerHTML = `Step ${cur + 1} of ${STEPS.length} · <b>${s.t}</b>`;
  $("keep").innerHTML = "<b>Keep ready:</b> " + esc(CONFIG.keepReady);
  $("keep").style.display = cur === 0 ? "" : "none";
  let h = `<h2>${s.en}</h2><span class="ur">${s.ur}</span>`;
  if (cur < 7) h += s.f.map(field).join("");
  else {
    const m = missing();
    if (m.length) h += `<p class="miss">Still required: ${m.map(x => `<a data-go="${x.i}" data-focus="${x.k}">${esc(x.n)}</a>`).join(", ")}</p>`;
    h += `<pre id="out">${esc(build())}</pre>
    <div class="nav"><button class="b" id="copy">Copy form</button><a class="b w" id="wa" target="_blank" rel="noopener">Open WhatsApp</a></div>`;
  }
  h += `<div class="nav"><button class="b g" id="back" ${cur === 0 ? "disabled style='opacity:.4'" : ""}>Back</button>${cur < 7 ? '<button class="b" id="next">Next: ' + STEPS[cur + 1].t + "</button>" : '<button class="b g" id="clear">Clear form</button>'}</div>`;
  if (cur < 7) h += `<div class="nav" style="justify-content:center"><button class="b g" id="clear" style="padding:6px 14px;font-size:13px">Clear form</button></div>`;
  $("card").innerHTML = h;
  if (cur === 7) $("wa").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(build())}`;
  save();
}

function go(i, focus) {
  cur = i; bad.clear(); render(); window.scrollTo({top: 0, behavior: "smooth"});
  if (focus) { bad.add(focus); render(); const el = document.querySelector(`[data-k="${focus}"] input,[data-k="${focus}"] select,[data-k="${focus}"] textarea`); el && el.focus(); }
}
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 1600); }

document.addEventListener("input", e => {
  const n = e.target.name; if (!n) return;
  S[n] = e.target.value;
  if (n === "dob" && e.target.value) {
    const d = new Date(e.target.value), t = new Date();
    let a = t.getFullYear() - d.getFullYear();
    if (t < new Date(t.getFullYear(), d.getMonth(), d.getDate())) a--;
    if (a > 0 && a < 100) { S.age = String(a); const el = document.querySelector('[name="age"]'); if (el) { el.value = a; bad.delete('age'); const fb = el.closest('.f'); fb && fb.classList.remove('bad'); } }
  }
  const box = e.target.closest(".f"); if (box) { bad.delete(n); box.classList.remove("bad"); }
  save();
});

document.addEventListener("click", e => {
  const t = e.target.closest("button,a"); if (!t) return;
  if (t.dataset.go !== undefined) return go(+t.dataset.go, t.dataset.focus);
  if (t.id === "back" && cur > 0) return go(cur - 1);
  if (t.id === "next") {
    const m = STEPS[cur].f.filter(f => f[5] && !String(S[f[0]] || "").trim());
    if (m.length) { bad = new Set(m.map(f => f[0])); render(); const el = document.querySelector(".bad"); el && el.scrollIntoView({behavior: "smooth", block: "center"}); return; }
    return go(cur + 1);
  }
  if (t.id === "clear" && confirm("Clear all the details you have entered?")) { S = {}; try { localStorage.removeItem(KEY); } catch (x) {} return go(0); }
  if (t.id === "copy") {
    const txt = build();
    const fb = () => { const a = document.createElement("textarea"); a.value = txt; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); toast("Copied! Paste it in WhatsApp"); } catch (x) { toast("Select the text and copy manually"); } a.remove(); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => toast("Copied! Paste it in WhatsApp"), fb); else fb();
  }
});
